# Lokalno okruženje za razvoj. Ništa ovdje ne ide u produkciju bez izmjene lozinki.

services:
  postgres:
    # PostGIS je u stacku zbog geometrije dionica i tačaka stanica (Faza 2).
    image: postgis/postgis:16-3.4
    container_name: vodostaji-postgres
    environment:
      POSTGRES_DB: vodostaji
      POSTGRES_USER: vodostaji
      POSTGRES_PASSWORD: vodostaji-local-dev
      # Baza radi u UTC-u. Sve vrijeme u sistemu je UTC (CLAUDE.md → Konvencije),
      # pa lokalna zona servera nema gdje da se umiješa.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vodostaji -d vodostaji"]
      interval: 5s
      timeout: 5s
      retries: 10

# Redis je namjerno izostavljen.
#
# Stoji u stacku u CLAUDE.md kao plan, ali ga nijedan red koda ne koristi: mapa se servira
# kao statički GeoJSON koji ingest job prepisuje, pa keša nema šta držati. Servis koji radi
# a nikom ne treba izgleda kao dio sistema i navodi na pogrešnu sliku kako sistem radi.
#
# Vraća se onog dana kad postoji nešto što se stvarno keširaju — i tada uz TTL koji nije
# duži od osvježavanja izvora, jer bi to bila lažna svježina.

volumes:
  postgres-data:
